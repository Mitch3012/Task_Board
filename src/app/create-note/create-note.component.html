<form [formGroup]="taskForm"(ngSubmit)="onSubmit()">
    <h3 class="mb-6 text-center text-3xl font-bold m-3 text-white drop-shadow-lg">Add a task to the taskboard</h3>
        <div class="flex flex-col items-center gap-4">
            <div class="flex flex-col items-center">
                <label class="text-white text-2xl ml-1.5">Task Title:</label>
                <input class="rounded-3xl shadow-md hover:-translate-y-0.5 p-2 m-2 text-white h-8 w-100 border-2 border-solid border-white hover:border-gray-600" formControlName = "title">
            </div>
     <div class="flex flex-col items-center">           
        <label class="text-white text-2xl ml-1.5">Description:</label>
        <input class="rounded-3xl shadow-md hover:-translate-y-0.5 p-2 m-2 text-white h-8 w-100 border-2 border-solid border-white hover:border-gray-600" formControlName = "description">
    </div>
    
    <div class="flex-items-center gap-2">
    <label class="text-white text-2xl ml-1.5">Completed: </label> 
    <input type ="checkbox" formControlName = "completed">
    </div>
    <button class="rounded-3xl shadow-md hover:-translate-y-0.5 mt-1.5 bg-green-600 ml-7 mr-2 text-white h-12 w-40 hover:bg-green-800 border-2 hover:border-gray-600" type = "submit">Create task</button>
    
</div>
</form>

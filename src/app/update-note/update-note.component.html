<button class="rounded-3xl shadow-md hover:-translate-y-0.5 bg-amber-600 m-7 text-white h-14 w-40 hover:bg-amber-800 border-2 hover:border-gray-600" routerLink="/NoteList">Home</button>
<form [formGroup]="editForm"(ngSubmit)="onSub()">
  
<h3 class="mb-6 text-center text-3xl font-bold m-3 text-white drop-shadow-lg">Change a task from our tasklist.</h3>
    <div class="flex flex-col items-center gap-4">
    <div class="flex flex-col items-center gap-2">
    <label class="text-white text-2xl ml-1.5">Task title: </label>
    <input class="rounded-3xl shadow-md hover:-translate-y-0.5 p-2 m-2 text-white h-8 w-100 border-2 border-solid border-white hover:border-gray-600 focus:border-purple-800 focus:border-4 focus:border-dashed focus:text-purple-800" formControlName="title"> 
</div>

<div class="flex flex-col items-center gap-2">
    <label class="text-white text-2xl ml-1.5">Description: </label>
    <input class="rounded-3xl shadow-md hover:-translate-y-0.5 p-2 m-2 text-white h-8 w-100 border-2 border-solid border-white hover:border-gray-600  focus:border-purple-800 focus:border-4 focus:border-dashed focus:text-purple-800" formControlName="description">
</div>

    <label for="color"  class="text-white text-2xl ml-1.5">Note color</label>
        <select id="color"
        formControlName = "color"
        class="rounded-3xl p-2 text-white">
            <option value="yellow">Yellow</option>
            <option value="pink">Pink</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
  </select>

<div class="flex-items-center gap-2">
    <label class="text-white text-2xl ml-1.5">Completed: </label>
    <input type="checkbox" formControlName="completed">
</div>
  <button [disabled]="editForm.pristine || editForm.invalid" 
    class="rounded-3xl 
    shadow-md 
    hover:-translate-y-0.5
     bg-amber-600 m-2
     text-white h-12 w-40
     hover:bg-amber-800 border-2
     hover:border-gray-600
     disabled:bg-slate-800
     disabled:cursor-not-allowed
     disabled:hover:translate-y-0" 
     type="submit">
    Save Changes
</button>
</div>
</form>

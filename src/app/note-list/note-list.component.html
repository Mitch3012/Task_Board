<ul>
    @for (task of tasks(); track task.id){
        <li>
            <h3>Task title: {{ task.title }}</h3>
            <label> 
                <input type="checkbox"[checked]="task.completed" disabled>
                <p>Complete</p>
            </label>
            <button (click)="getTaskDetails(task)">View task details</button>
            <a [routerLink]="['/tasks', task.id, 'update-note']">Edit task</a>
            <button (click)="onDelete(task.id)">Delete Task</button>
        </li>
    }
</ul>
@if (currentTask !== null){
    <h3>{{currentTask.title}}</h3>
    <p>{{currentTask.description}}</p>
}
